services:
  # API'yi konteynerde çalıştırmak için: docker compose --profile app up -d
  # Geliştirmede genellikle gerekmez; "dotnet run" daha hızlı geri bildirim verir.
  api:
    build:
      context: .
      dockerfile: src/Yolla.Api/Dockerfile
    image: yolla-api
    container_name: yolla-api
    profiles: ["app"]
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Konteynerler birbirini servis adıyla bulur, localhost ile değil
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=yolla;Username=yolla;Password=${POSTGRES_PASSWORD:-yolla_dev}"
      ConnectionStrings__Redis: "redis:6379"
      Osrm__CarBaseUrl: "http://osrm-car:5000"
      Osrm__FootBaseUrl: "http://osrm-foot:5000"
      # Üretimde bu iki değer mutlaka dışarıdan verilmeli
      Jwt__Key: ${JWT_KEY:?Jwt__Key tanimlanmali}
      Admin__ApiKey: ${ADMIN_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5
    container_name: yolla-postgres
    environment:
      POSTGRES_DB: yolla
      POSTGRES_USER: yolla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yolla_dev}
    ports:
      - "5432:5432"
    volumes:
      - yolla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yolla -d yolla"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yolla-redis
    ports:
      - "6379:6379"
    volumes:
      - yolla-redisdata:/data

  # OSM ham verisini filtreleyip GeoJSONSeq'e çeviren araç kutusu.
  # Sürekli çalışmaz; "tools" profili altında olduğu için sadece elle çağrılır:
  #   docker compose run --rm osmium tags-filter ...
  osmium:
    build: ./docker/osmium
    image: yolla-osmium
    container_name: yolla-osmium
    profiles: ["tools"]
    volumes:
      - ./data:/data

  # --- OSRM ---
  # Ilk calistirmadan once Turkiye verisi indirilip hazirlanmali (bkz. docs/osrm-setup.md).
  # Ayni .osrm dosyalari iki profil icin ayri klasorlerde uretilir.

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: yolla-osrm-car
    command: osrm-routed --algorithm mld /data/turkey-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm/car:/data
    restart: unless-stopped

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: yolla-osrm-foot
    command: osrm-routed --algorithm mld /data/turkey-latest.osrm
    ports:
      - "5001:5000"
    volumes:
      - ./osrm/foot:/data
    restart: unless-stopped

volumes:
  yolla-pgdata:
  yolla-redisdata:
